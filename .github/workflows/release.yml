name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（例如 v1.0.1）；不存在时会基于当前提交创建'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/package-lock.json

      - name: Install dependencies
        working-directory: tools
        run: npm ci

      - name: Type check
        working-directory: tools
        run: npx tsc -p ../tsconfig.json

      - name: Run tests
        working-directory: tools
        run: npm test

      - name: Package Cocos scripts
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/due-client-cocos-${RELEASE_TAG}.zip"
          (cd assets && zip -r "../${archive}" scripts)
          zip -j "${archive}" README.md
          unzip -l "${archive}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="dist/due-client-cocos-${RELEASE_TAG}.zip"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${archive}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              "${archive}"
          fi
